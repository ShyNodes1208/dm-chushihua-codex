<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>达梦数据库信息看板</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="main">
    <header class="toolbar">
      <div class="query-head">
        <div class="query-picker">
          <label for="querySelect">查询</label>
          <select id="querySelect"></select>
          <span id="queryStatus" class="status-pill missing">
            <span class="dot missing"></span>
            <span>未缓存</span>
          </span>
        </div>
        <p id="queryMeta">选择查询后查看缓存的数据库信息。</p>
      </div>
      <div class="actions">
        <button id="refreshBtn" class="primary-action">刷新</button>
        <button id="refreshAllBtn">全部刷新</button>
        <button id="exportBtn">导出 Excel</button>
        <div class="column-menu">
          <button id="columnBtn" type="button" aria-expanded="false">列设置</button>
          <div id="columnPanel" class="column-panel" hidden></div>
        </div>
        <input id="searchInput" type="search" placeholder="搜索">
      </div>
    </header>

    <section id="toast" class="toast" hidden></section>
    <div id="cellTooltip" class="cell-tooltip" hidden></div>
    <section id="resultArea" class="result-area">
      <div class="empty">请先在上方选择 SQL 查询。</div>
    </section>
    <footer id="pager" class="pager" hidden>
      <button id="prevPage">上一页</button>
      <span id="pageInfo"></span>
      <button id="nextPage">下一页</button>
      <label>跳转到 <input id="jumpPage" type="number" min="1"> </label>
    </footer>
  </main>

  <script>
    const pageSize = Number({{ page_size|tojson }}) || 10;
    const state = { queries: [], current: null, cache: null, page: 1, search: "", hiddenColumns: new Set(), columnWidths: {} };
    const statusText = { valid: "有效", stale: "已过期", missing: "未缓存" };
    const $ = (id) => document.getElementById(id);

    async function api(url, options = {}) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "请求失败");
      return data;
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.hidden = false;
      setTimeout(() => toast.hidden = true, 3500);
    }

    async function loadQueries() {
      const data = await api("/api/queries");
      state.queries = data.queries || [];
      renderQuerySelect();
      if (!state.current && state.queries.length > 0) {
        await selectQuery(state.queries[0].name);
      }
    }

    async function selectQuery(name) {
      state.current = name;
      state.page = 1;
      syncQuerySelect();
      updateQueryStatus(queryStatusFor(name));
      try {
        state.cache = await api(`/api/query/${encodeURIComponent(name)}`);
        if (state.cache && state.cache.status === "missing") {
          $("queryMeta").textContent = "首次加载，正在查询...";
          updateQueryStatus("missing");
          await refreshCurrent();
          return;
        }
        render();
      } catch (err) {
        if (err.message && err.message.includes("No cache")) {
          $("queryMeta").textContent = "首次加载，正在查询...";
          updateQueryStatus("missing");
          await refreshCurrent();
          return;
        }
        state.cache = null;
        $("queryMeta").textContent = err.message;
        updateQueryStatus("missing");
        $("resultArea").innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
        $("pager").hidden = true;
      }
      await loadQueries();
    }

    function renderQuerySelect() {
      const select = $("querySelect");
      select.disabled = state.queries.length === 0;
      select.innerHTML = state.queries.length
        ? state.queries.map(q => `<option value="${escapeAttr(q.name)}">${escapeHtml(q.name)}</option>`).join("")
        : '<option value="">暂无查询</option>';
      syncQuerySelect();
      updateQueryStatus(queryStatusFor(state.current));
    }

    function syncQuerySelect() {
      const select = $("querySelect");
      if (state.current && select.value !== state.current) {
        select.value = state.current;
      }
    }

    function queryStatusFor(name) {
      const query = state.queries.find(item => item.name === name);
      return query ? query.status : "missing";
    }

    function updateQueryStatus(status) {
      const safeStatus = statusText[status] ? status : "missing";
      $("queryStatus").className = `status-pill ${safeStatus}`;
      $("queryStatus").innerHTML = `<span class="dot ${safeStatus}"></span><span>${escapeHtml(statusText[safeStatus])}</span>`;
    }

    async function refreshCurrent() {
      if (!state.current) return showToast("请先选择查询。");
      $("refreshBtn").disabled = true;
      try {
        state.cache = await api(`/api/query/${encodeURIComponent(state.current)}/refresh`, { method: "POST" });
        state.page = 1;
        render();
        showToast("刷新完成。");
      } catch (err) {
        showToast(err.message);
      } finally {
        $("refreshBtn").disabled = false;
        await loadQueries();
      }
    }

    function isKeyValue(cache) {
      return cache.display_mode === "key_value";
    }

    function buildKeyValue(cache) {
      const keys = [];
      const values = {};
      const errors = {};
      const instanceKeys = [];
      const instanceLabels = [];
      for (const [index, row] of (cache.rows || []).entries()) {
        const instanceKey = `${index}:${row.instance || ""}`;
        instanceKeys.push(instanceKey);
        instanceLabels.push(row.instance);
        values[instanceKey] = {};
        if (row.error) errors[instanceKey] = row.error;
        for (const item of row.data || []) {
          if (!keys.includes(item[0])) keys.push(item[0]);
          const val = item[1];
          if (val != null && val !== "") {
            values[instanceKey][item[0]] = val;
          } else if (!(item[0] in values[instanceKey])) {
            values[instanceKey][item[0]] = "";
          }
        }
      }
      const headers = ["item", ...instanceLabels];
      const body = keys.map(key => [key, ...instanceKeys.map(instanceKey => values[instanceKey]?.[key] ?? errors[instanceKey] ?? "")]);
      if (!body.length && Object.keys(errors).length) {
        body.push(["error", ...instanceKeys.map(instanceKey => errors[instanceKey] || "")]);
      }
      return { headers, body, mode: "keyValue", rowHasError: body.map(() => (cache.rows || []).some(row => row.error)), lockedColumns: 1 };
    }

    function buildMeta(cache) {
      const labels = cache.column_labels || [];
      const headers = ["instance", "env", ...labels];
      const body = [];
      const rowHasError = [];
      for (const row of cache.rows || []) {
        let data = Array.isArray(row.data) ? [...row.data] : [];
        if (row.error) {
          data = [row.error, ...Array(Math.max(0, labels.length - 1)).fill("")];
        }
        if (data.length < labels.length) {
          data = data.concat(Array(labels.length - data.length).fill(""));
        } else if (data.length > labels.length) {
          data = data.slice(0, labels.length);
        }
        body.push([row.instance, row.env || "", ...data]);
        rowHasError.push(Boolean(row.error));
      }
      return { headers, body, mode: "meta", rowHasError, lockedColumns: 2 };
    }

    function buildFlat(cache) {
      let base = [];
      for (const row of cache.rows || []) {
        if ((row.columns || []).length > base.length) base = row.columns;
      }
      if (!base.length) {
        const maxValues = Math.max(0, ...(cache.rows || []).flatMap(row => (row.data || []).map(item => item.length)));
        base = Array.from({ length: maxValues }, (_, index) => `col_${index + 1}`);
      }
      const headers = ["instance", "env", ...base, "error"];
      const body = [];
      const rowHasError = [];
      for (const row of cache.rows || []) {
        if (row.error) {
          body.push([row.instance, row.env || "", ...base.map(() => ""), row.error]);
          rowHasError.push(true);
        } else {
          const dataRows = row.data || [];
          if (!dataRows.length) {
            body.push([row.instance, row.env || "", ...base.map(() => ""), ""]);
            rowHasError.push(false);
            continue;
          }
          for (const item of dataRows) {
            body.push([row.instance, row.env || "", ...normalizeLength(item, base.length), ""]);
            rowHasError.push(false);
          }
        }
      }
      return { headers, body, mode: "flat", rowHasError, lockedColumns: 2 };
    }

    function normalizeLength(values, length) {
      const normalized = Array.isArray(values) ? values.slice(0, length) : [];
      while (normalized.length < length) normalized.push("");
      return normalized;
    }

    function rowMatches(row) {
      const keyword = state.search.trim().toLowerCase();
      if (!keyword) return true;
      return row.join(" ").toLowerCase().includes(keyword);
    }

    function render() {
      const cache = state.cache;
      if (!cache) return;
      $("queryMeta").textContent = `上次查询：${cache.queried_at || "从未查询"} | ${statusText[cache.status] || cache.status}`;
      updateQueryStatus(cache.status);

      const table = cache.column_labels ? buildMeta(cache) : (isKeyValue(cache) ? buildKeyValue(cache) : buildFlat(cache));
      syncHiddenColumns(table);
      renderColumnPanel(table);
      let rowItems = table.body.map((row, index) => {
        const error = Boolean(table.rowHasError[index]);
        return { row, index, error };
      }).filter(item => rowMatches(item.row));

      const count = rowItems.length;
      const totalPages = Math.max(1, Math.ceil(count / pageSize));
      state.page = Math.min(Math.max(1, state.page), totalPages);

      let headers = table.headers;
      const start = (state.page - 1) * pageSize;
      rowItems = rowItems.slice(start, start + pageSize);

      const renderRows = rowItems.map(item => {
        const cls = item.error ? "error-row" : "";
        return `<tr class="${cls}">${item.row.map((cell, index) => renderCell("td", cell, index, table)).join("")}</tr>`;
      }).join("");

      $("resultArea").innerHTML = `
        <div class="table-wrap">
          <table class="excel-table" style="--frozen-1-width:${state.columnWidths[0] || defaultColumnWidth(0, table)}px">
            <thead><tr>${headers.map((h, index) => renderCell("th", h, index, table)).join("")}</tr></thead>
            <tbody>${renderRows}</tbody>
          </table>
        </div>
      `;
      initColumnResize();
      $("pager").hidden = false;
      $("pageInfo").textContent = `第 ${state.page}/${totalPages} 页`;
      $("prevPage").disabled = state.page <= 1;
      $("nextPage").disabled = state.page >= totalPages;
      $("jumpPage").max = totalPages;
      $("jumpPage").value = state.page;
    }

    function renderCell(tag, value, index, table) {
      const text = String(value ?? "");
      const classes = [];
      if (index < (table.lockedColumns || 2)) classes.push(`frozen-col frozen-${index + 1}`);
      if (index === 0) classes.push("row-label");
      if (state.hiddenColumns.has(index)) classes.push("hidden-col");
      if (isNumericText(text)) classes.push("numeric");
      const width = state.columnWidths[index] || defaultColumnWidth(index, table);
      const resize = tag === "th" ? '<span class="col-resizer" data-col="' + index + '"></span>' : "";
      return `<${tag} class="${classes.join(" ")}" data-col="${index}" data-tooltip="${escapeAttr(text)}" style="width:${width}px;min-width:${width}px;max-width:${width}px">${escapeHtml(text)}${resize}</${tag}>`;
    }

    function defaultColumnWidth(index, table) {
      if (table.mode === "meta") {
        if (index === 0) return 150;
        if (index === 1) return 100;
        return 180;
      }
      if (index === 0) return 220;
      if ((table.lockedColumns || 2) >= 2 && index === 1) return 100;
      return 180;
    }

    function isNumericText(value) {
      const text = String(value ?? "").trim();
      return text !== "" && /^-?\d+(\.\d+)?$/.test(text);
    }

    function syncHiddenColumns(table) {
      const headers = table.headers || [];
      const locked = table.lockedColumns || 2;
      const max = headers.length - 1;
      for (const index of Array.from(state.hiddenColumns)) {
        if (index > max || index < locked) state.hiddenColumns.delete(index);
      }
    }

    function renderColumnPanel(table) {
      const panel = $("columnPanel");
      const locked = table.lockedColumns || 2;
      const headers = table.headers || [];
      panel.innerHTML = headers.map((header, index) => index < locked ? "" : `
        <label>
          <input type="checkbox" data-col="${index}" ${state.hiddenColumns.has(index) ? "" : "checked"}>
          <span>${escapeHtml(header)}</span>
        </label>
      `).join("");
      panel.querySelectorAll("input[type='checkbox']").forEach(input => {
        input.addEventListener("change", () => {
          const col = Number(input.dataset.col);
          if (input.checked) state.hiddenColumns.delete(col);
          else state.hiddenColumns.add(col);
          render();
        });
      });
    }

    function initColumnResize() {
      document.querySelectorAll(".col-resizer").forEach(handle => {
        handle.addEventListener("mousedown", event => {
          event.preventDefault();
          const col = Number(handle.dataset.col);
          const startX = event.clientX;
          const th = handle.closest("th");
          const startWidth = th ? th.getBoundingClientRect().width : (state.columnWidths[col] || 180);
          const overlay = document.createElement("div");
          overlay.className = "resize-overlay";
          document.body.appendChild(overlay);

          const onMove = moveEvent => {
            const width = Math.max(60, Math.min(500, Math.round(startWidth + moveEvent.clientX - startX)));
            state.columnWidths[col] = width;
            if (col === 0) {
              const table = document.querySelector(".excel-table");
              if (table) table.style.setProperty("--frozen-1-width", `${width}px`);
            }
            document.querySelectorAll(`[data-col="${col}"]`).forEach(cell => {
              cell.style.width = `${width}px`;
              cell.style.minWidth = `${width}px`;
              cell.style.maxWidth = `${width}px`;
            });
          };
          const onUp = () => {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
            overlay.remove();
          };
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
      });
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    function initCellTooltip() {
      const tooltip = $("cellTooltip");
      const hide = () => {
        tooltip.hidden = true;
        tooltip.textContent = "";
      };
      const show = (event, cell) => {
        const text = cell.dataset.tooltip || "";
        if (!text) return hide();
        if (cell.scrollWidth <= cell.clientWidth && cell.scrollHeight <= cell.clientHeight) return hide();
        tooltip.textContent = text;
        tooltip.hidden = false;
        move(event);
      };
      const move = event => {
        if (tooltip.hidden) return;
        const margin = 12;
        const offset = 14;
        const rect = tooltip.getBoundingClientRect();
        let left = event.clientX + offset;
        let top = event.clientY + offset;
        if (left + rect.width + margin > window.innerWidth) {
          left = Math.max(margin, event.clientX - rect.width - offset);
        }
        if (top + rect.height + margin > window.innerHeight) {
          top = Math.max(margin, event.clientY - rect.height - offset);
        }
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
      };

      document.addEventListener("mouseover", event => {
        const cell = event.target.closest(".excel-table th, .excel-table td");
        if (!cell) return;
        show(event, cell);
      });
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseout", event => {
        if (event.target.closest(".excel-table th, .excel-table td")) hide();
      });
      window.addEventListener("scroll", hide, true);
    }

    $("refreshBtn").addEventListener("click", refreshCurrent);
    $("querySelect").addEventListener("change", e => selectQuery(e.target.value));
    $("exportBtn").addEventListener("click", () => {
      if (!state.current) return showToast("请先选择查询。");
      location.href = `/api/query/${encodeURIComponent(state.current)}/export`;
    });
    $("columnBtn").addEventListener("click", event => {
      event.stopPropagation();
      const panel = $("columnPanel");
      panel.hidden = !panel.hidden;
      $("columnBtn").setAttribute("aria-expanded", String(!panel.hidden));
    });
    document.addEventListener("click", event => {
      const menu = document.querySelector(".column-menu");
      if (menu && !menu.contains(event.target)) {
        $("columnPanel").hidden = true;
        $("columnBtn").setAttribute("aria-expanded", "false");
      }
    });
    $("refreshAllBtn").addEventListener("click", async () => {
      $("refreshAllBtn").disabled = true;
      try {
        await api("/api/refresh-all", { method: "POST" });
        showToast("全部查询刷新完成。");
        if (state.current) await selectQuery(state.current);
      } catch (err) {
        showToast(err.message);
      } finally {
        $("refreshAllBtn").disabled = false;
        await loadQueries();
      }
    });
    $("searchInput").addEventListener("input", e => { state.search = e.target.value; state.page = 1; render(); });
    $("prevPage").addEventListener("click", () => { state.page -= 1; render(); });
    $("nextPage").addEventListener("click", () => { state.page += 1; render(); });
    $("jumpPage").addEventListener("change", e => { state.page = Number(e.target.value) || 1; render(); });

    initCellTooltip();
    loadQueries().catch(err => showToast(err.message));
  </script>
</body>
</html>
